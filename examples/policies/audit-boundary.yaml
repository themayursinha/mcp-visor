version: "1.0"
description: >
  H49 audit-boundary fixture. A policy-selected MCP tool may reach only the
  operator-declared workload substitute. Attaching allow_destination or
  allow_path_slot is the effect bound: sandbox-service hosts, harness-control
  hosts, evaluator artifact paths, and evaluator env/config paths are outside
  the mandate and deny before relay. This does not attest a third-party
  sandbox, classify shared channels as inter-principal communication, or
  prove host/container isolation. Route absence means these four tools/call
  fixtures are denied; omitting the slot rules is the negative control.
default_action: deny
servers:
  - name: "workload"
    allowed: true
    tools:
      - name: "fetch_sandbox"
        allowed: true
        risk: high
        rules:
          - type: allow_destination
            patterns:
              - "workload.example"
      - name: "fetch_control"
        allowed: true
        risk: high
        rules:
          - type: allow_destination
            patterns:
              - "workload.example"
      - name: "read_artifact"
        allowed: true
        risk: high
        rules:
          - type: allow_path_slot
            patterns:
              - "/workload"
              - "/workload/**"
      - name: "read_config"
        allowed: true
        risk: high
        rules:
          - type: allow_path_slot
            patterns:
              - "/workload"
              - "/workload/**"
