version: "1.0"
description: >
  H49 audit-boundary fixture. Attaching allow_destination or allow_path_slot
  filters URL/HOST arguments by exact host and PATH/TARGET arguments by
  lexical glob. These rules do not follow redirects, resolve DNS, or bind
  inodes, so a mandate host or path string is not a reachability proof.
  Sandbox-service hosts, harness-control hosts, evaluator artifact paths, and
  evaluator env/config paths fail the attached slot filters. Named workload
  substitutes pass them. Omitting the slot rules is the negative control.
  This does not attest a third-party sandbox, classify shared channels as
  inter-principal communication, or prove host/container isolation.
default_action: deny
servers:
  - name: "workload"
    allowed: true
    tools:
      - name: "fetch_sandbox"
        allowed: true
        risk: high
        rules:
          - type: allow_destination
            patterns:
              - "workload.example"
      - name: "fetch_control"
        allowed: true
        risk: high
        rules:
          - type: allow_destination
            patterns:
              - "workload.example"
      - name: "read_artifact"
        allowed: true
        risk: high
        rules:
          - type: allow_path_slot
            patterns:
              - "/workload"
              - "/workload/**"
      - name: "read_config"
        allowed: true
        risk: high
        rules:
          - type: allow_path_slot
            patterns:
              - "/workload"
              - "/workload/**"
