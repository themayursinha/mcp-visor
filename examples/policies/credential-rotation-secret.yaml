version: "1.0"
description: >
  Local RAGFlow credential-rotation fixture. A schema-valid configure_secret
  of a replacement key is not a custody proof. Forwarding KEY_B through an
  MCP provisioning tool can replenish an interceptor. Attaching deny_secret
  is the effect bound: SECRET-class arguments deny before relay. Visor does
  not attest the provisioning runtime or allowlist key material.
default_action: deny
servers:
  - name: "gateway"
    allowed: true
    tools:
      - name: "file_read"
        allowed: true
        risk: low
      - name: "configure_secret"
        allowed: true
        risk: high
        rules:
          - type: deny_secret
