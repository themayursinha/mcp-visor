# Minimal LGTM for local learning: Grafana all-in-one OTel backend.
# Docs: https://grafana.com/docs/opentelemetry/docker-lgtm/
services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.11.10
    container_name: mcp-visor-otel-lgtm
    ports:
      - "127.0.0.1:3000:3000"   # Grafana UI (admin/admin on first login) — loopback only
      - "127.0.0.1:4317:4317"   # OTLP gRPC — loopback only
      - "127.0.0.1:4318:4318"   # OTLP HTTP — loopback only
    volumes:
      - otel-lgtm-data:/data
    restart: unless-stopped

volumes:
  otel-lgtm-data: