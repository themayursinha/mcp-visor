name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sensitive-content:
    name: Sensitive content scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: bash scripts/check-sensitive-content

  test:
    name: Build & Test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: ["1.26.8"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - run: go build ./...
      - run: go test ./... -count=1 -timeout 120s -coverprofile=coverage.out

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6.0.0
        with:
          go-version: "1.26.8"
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
      - run: govulncheck ./...
      - run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1
      - run: osv-scanner go.mod go.sum

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6.0.0
        with:
          go-version: "1.26.8"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

  release-dryrun:
    name: Release dry-run (snapshot incl. SBOM + signing)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6.0.0
        with:
          go-version: "1.26.8"
      - run: go install github.com/anchore/syft/cmd/syft@v1.51.1
      - run: go install github.com/sigstore/cosign/v3/cmd/cosign@v3.1.3
      # Fork PRs get no OIDC token, so keyless signing cannot run there. Keep
      # snapshot+SBOM validation for every PR; skip only the signing step from
      # untrusted fork context.
      - name: Determine signing
        id: sign
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "skip=--skip=sign" >> "$GITHUB_OUTPUT"
          fi
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.0.0
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --snapshot --clean --skip=publish ${{ steps.sign.outputs.skip }}